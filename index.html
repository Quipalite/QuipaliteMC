<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Quipalite MC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://yt3.googleusercontent.com/71g321HWP1axLSjFPqSfgtcAI0FVNWoh61WHv4ZA-bCBMiCjIookbp_Xk-nfx8ubiS-lIvm_3Q=s160-c-k-c0x00ffffff-no-rj" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent-pink:#ff1493;
      --accent-muted:#ff66cc;
      --bg-dark:#070707;
      --card-dark:#0f0f12;
      --muted:#141416;
      --podium-gold-tint: linear-gradient(180deg, rgba(255,246,214,0.06), rgba(255,230,128,0.03));
      --podium-silver-tint: linear-gradient(180deg, rgba(242,247,251,0.05), rgba(219,233,247,0.02));
      --podium-bronze-tint: linear-gradient(180deg, rgba(250,239,224,0.05), rgba(242,217,182,0.02));
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background:var(--bg-dark);
      color:#eaeaea;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      z-index:-1;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255,20,147,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(255,102,204,0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 60% 80%, rgba(180,0,120,0.06) 0%, transparent 50%),
        var(--bg-dark);
      animation: bgWave 12s ease-in-out infinite alternate;
      will-change: transform;
    }
    body::after{
      content:'';
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      z-index:-1;
      background:
        radial-gradient(ellipse at 70% 60%, rgba(255,20,147,0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 30% 20%, rgba(255,0,100,0.04) 0%, transparent 50%);
      animation: bgWave2 16s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes bgWave{
      0%  { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.04); }
      66% { transform: translate(-20px, 30px) scale(0.97); }
      100%{ transform: translate(20px, 10px) scale(1.02); }
    }
    @keyframes bgWave2{
      0%  { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(-40px, 20px) scale(1.03); }
      66% { transform: translate(25px, -30px) scale(0.98); }
      100%{ transform: translate(-15px, -10px) scale(1.01); }
    }
    body.mono::before, body.mono::after{ display:none; }

    header{
      text-align:center;
      padding:36px 20px;
      background:linear-gradient(90deg,#ff2db2,#ff66cc,#ff1493);
      background-size:300% 300%;
      animation:bannerMove 6s ease infinite;
      border-bottom:1px solid rgba(255,20,147,0.08);
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }
    @keyframes bannerMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
    .logo{ font-size:34px; font-weight:800; letter-spacing:2px; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,0.45); }
    .subtitle{ font-size:13px; opacity:0.9; color:rgba(255,255,255,0.92); font-weight:600; letter-spacing:1px; }

    .theme-toggle{
      width:52px; height:26px; border-radius:14px; background:#fff; cursor:pointer;
      display:flex; align-items:center; padding:3px; box-sizing:border-box; box-shadow:0 6px 18px rgba(0,0,0,0.25);
    }
    .theme-toggle .toggle-thumb{ width:20px;height:20px;border-radius:50%; transition:transform .25s, background .25s; background:#000; transform:translateX(0); }

    .tabs{ text-align:center; margin:16px 0; display:flex; justify-content:center; gap:14px; flex-wrap:wrap; padding:0 12px; }
    .tab{
      background:transparent; border:none; border-bottom:2px solid transparent; padding:8px 14px; border-radius:6px; cursor:pointer;
      font-weight:700; color:rgba(255,255,255,0.65); transition:color .18s, transform .18s, border-color .25s ease, background .18s;
      position:relative;
    }
    .tab:hover{ color:white; transform:translateY(-3px); background:rgba(255,255,255,0.04); }
    .tab.active{ border-bottom:2px solid var(--accent-pink); color:white; }
    .tab.active::after{
      content:'';
      position:absolute;
      bottom:-2px; left:50%; transform:translateX(-50%);
      width:60%; height:2px;
      background:var(--accent-pink);
      filter:blur(4px);
      border-radius:2px;
      animation:tabGlow .3s ease forwards;
    }
    @keyframes tabGlow{ from{opacity:0;width:0%;}to{opacity:1;width:60%;} }

    #searchInput{
      width:320px; max-width:92%; padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.06);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); color:white; font-weight:600; outline:none;
      box-shadow:0 8px 30px rgba(0,0,0,0.55) inset;
    }
    #searchInput::placeholder{ color:rgba(255,255,255,0.35); font-weight:500; }

    .container{ max-width:980px; margin:auto; padding:20px; min-height:220px; animation:fadeIn .36s ease; }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

    .mode{ display:none; opacity:0; transform:translateY(8px); transition:opacity .3s ease, transform .3s cubic-bezier(0.22,1,0.36,1); }
    .mode.active{ display:block; opacity:1; transform:translateY(0); }

    .player{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.015));
      margin:12px 0; padding:16px; border-radius:12px; border:1px solid rgba(255,20,147,0.06);
      cursor:pointer; display:flex; align-items:center; position:relative; overflow:hidden; transition:transform .28s cubic-bezier(0.22,1,0.36,1), box-shadow .28s ease, border-color .28s ease;
      gap:12px;
    }
    .player::before{
      content:'';
      position:absolute;
      top:0; left:-100%; width:60%; height:100%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      transition:left .5s ease;
      pointer-events:none;
    }
    .player:hover::before{ left:150%; }
    .player:hover{ transform:translateY(-8px) scale(1.03); box-shadow:0 20px 52px rgba(0,0,0,0.7), 0 0 20px rgba(255,20,147,0.22); border-color:rgba(255,20,147,0.18); }

    .player-head{ width:48px;height:48px;border-radius:10px;border:2px solid rgba(255,255,255,0.04); object-fit:cover; background:#111; flex-shrink:0; transition:transform .22s ease, box-shadow .22s ease; }
    .player:hover .player-head{ transform:scale(1.08); box-shadow:0 8px 22px rgba(0,0,0,0.6); }

    .gold-glow{
      border:2px solid rgba(255,215,0,0.9) !important;
      box-shadow:
        0 0 10px rgba(255,215,0,0.25),
        0 0 22px rgba(255,215,0,0.18),
        0 0 36px rgba(255,215,0,0.12);
      animation:goldPulse 1.6s infinite alternate;
      background: var(--podium-gold-tint);
    }
    .silver-glow{
      border:2px solid rgba(192,192,192,0.95) !important;
      box-shadow:
        0 0 8px rgba(192,192,192,0.18),
        0 0 20px rgba(192,192,192,0.12);
      background: var(--podium-silver-tint);
    }
    .bronze-glow{
      border:2px solid rgba(205,127,50,0.95) !important;
      box-shadow:
        0 0 8px rgba(205,127,50,0.18),
        0 0 20px rgba(205,127,50,0.12);
      background: var(--podium-bronze-tint);
    }
    @keyframes goldPulse{
      from{ box-shadow:0 0 10px rgba(255,215,0,0.22), 0 0 20px rgba(255,215,0,0.16); }
      to{ box-shadow:0 0 18px rgba(255,215,0,0.30), 0 0 40px rgba(255,215,0,0.20); }
    }

    .player.top1{ transform:translateY(-6px) scale(1.03); }
    .player.top1 .number{ font-size:18px; font-weight:900; }
    .player.top2{ transform:translateY(-3px) scale(1.015); }
    .player.top3{ transform:translateY(-2px) scale(1.01); }

    .number{ display:inline-block; padding:6px 12px; border-radius:50%; font-weight:800; margin-right:10px; min-width:36px; text-align:center; z-index:2; color:white; background:transparent; border:1px solid rgba(255,255,255,0.04); font-size:13px; }

    .player-content{ opacity:0; transform:translateY(10px) scale(0.98); animation:fadeSlide .45s cubic-bezier(0.22,1,0.36,1) forwards; display:flex; align-items:center; gap:12px; width:100%; justify-content:space-between; }
    @keyframes fadeSlide{ to{opacity:1; transform:translateY(0) scale(1);} }

    .left{ display:flex; align-items:center; gap:12px; min-width:0; flex:1 1 auto; }
    .info{ display:flex; flex-direction:column; gap:4px; min-width:0; }
    .mini-stats{ font-size:12px; opacity:.85; color:rgba(255,255,255,0.9); }
    .right{ display:flex; align-items:center; gap:12px; flex-shrink:0; }

    .tier-badge{ display:inline-block; margin-left:8px; padding:4px 8px; border-radius:999px; font-size:12px; font-weight:700; line-height:1; box-shadow:0 2px 6px rgba(0,0,0,0.35); transition:transform .2s ease, box-shadow .2s ease; animation:badgePop .4s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes badgePop{ from{transform:scale(0.6);opacity:0;} to{transform:scale(1);opacity:1;} }
    .player:hover .tier-badge{ transform:scale(1.12); box-shadow:0 4px 14px rgba(0,0,0,0.5); }

    .crown{
      width:18px; height:18px; display:inline-block; vertical-align:middle; margin-left:6px;
      transform-origin:center;
      animation: crownBounce 1.4s cubic-bezier(0.36,0.07,0.19,0.97) infinite;
      filter: drop-shadow(0 0 6px rgba(255,215,0,0.8));
    }
    @keyframes crownBounce{
      0%  { transform: translateY(0) rotate(-8deg) scale(1); }
      15% { transform: translateY(-5px) rotate(8deg) scale(1.15); }
      30% { transform: translateY(0) rotate(-4deg) scale(0.95); }
      45% { transform: translateY(-3px) rotate(4deg) scale(1.05); }
      60% { transform: translateY(0) rotate(0deg) scale(1); }
      100%{ transform: translateY(0) rotate(0deg) scale(1); }
    }

    #profilePage{ display:none; max-width:700px; margin:auto; padding:20px; opacity:0; transform:translateY(28px) scale(0.97); transition:opacity .35s cubic-bezier(0.22,1,0.36,1), transform .35s cubic-bezier(0.22,1,0.36,1); }
    #profilePage.show{ opacity:1; transform:translateY(0) scale(1); }
    #profileContent{ background:var(--card-dark); padding:20px; border-radius:12px; border:1px solid rgba(255,20,147,0.06); color:white; }

    .backBtn{ background:var(--accent-pink); border:none; padding:10px 16px; color:white; font-weight:800; border-radius:8px; cursor:pointer; margin-bottom:20px; transition:all .2s; box-shadow:0 8px 20px rgba(255,20,147,0.12); }
    .backBtn:hover{ background:var(--accent-muted); }

    .stat-bar{ background:var(--muted); height:8px; border-radius:6px; margin-bottom:15px; overflow:hidden; position:relative; }
    .stat-fill{ height:100%; width:0%; transition:width 1s ease; position:relative; overflow:hidden; border-radius:6px; }
    .stat-fill::after{ content:''; position:absolute; top:0; left:-40%; width:40%; height:100%; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0) 100%); transform:skewX(-18deg); animation:statShine 1.6s linear infinite; pointer-events:none; }
    @keyframes statShine{ 0%{left:-40%;} 100%{left:140%;} }

    .no-players{ margin-top:20px; font-size:18px; text-align:center; padding:16px; border:2px dashed rgba(255,20,147,0.12); border-radius:12px; color:var(--accent-muted); font-weight:700; background: rgba(255,20,147,0.03); display:flex; justify-content:center; align-items:center; gap:10px; }

    /* ── TIER GUIDE MODAL ── */
    #tierGuideBtn{
      display:flex; align-items:center; gap:6px;
      background:rgba(255,20,147,0.18); color:white; font-weight:700; font-size:12px;
      padding:6px 10px; border-radius:8px; border:1px solid rgba(255,20,147,0.45);
      cursor:pointer; box-shadow:0 4px 12px rgba(255,20,147,0.15); transition:background .2s, border-color .2s;
    }
    #tierGuideBtn:hover{ background:rgba(255,20,147,0.32); border-color:rgba(255,20,147,0.7); }
    body.mono #tierGuideBtn{ background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.3); box-shadow:none; }
    body.mono #tierGuideBtn:hover{ background:rgba(255,255,255,0.14); border-color:rgba(255,255,255,0.6); }

    #tierModal{
      display:none; position:fixed; inset:0; z-index:10000;
      align-items:center; justify-content:center; padding:20px;
    }

    #tierModalBackdrop{
      position:absolute; inset:0;
      background:rgba(0,0,0,0.75); backdrop-filter:blur(6px);
      opacity:0; transition:opacity .3s ease;
    }
    #tierModal.open #tierModalBackdrop{ opacity:1; }
    #tierModal.closing #tierModalBackdrop{ opacity:0; }

    #tierModalInner{
      position:relative; z-index:1;
      background:#0f0f14; border:1px solid rgba(255,20,147,0.18);
      border-radius:18px; padding:28px 24px; max-width:480px; width:100%;
      box-shadow:0 32px 80px rgba(0,0,0,0.8), 0 0 40px rgba(255,20,147,0.08);
      opacity:0; transform:translateY(24px) scale(0.95);
      transition:opacity .32s cubic-bezier(0.22,1,0.36,1), transform .32s cubic-bezier(0.22,1,0.36,1);
      max-height:90vh; overflow-y:auto;
    }
    #tierModal.open #tierModalInner{
      opacity:1; transform:translateY(0) scale(1);
      transition-delay:0.04s;
    }
    #tierModal.closing #tierModalInner{
      opacity:0; transform:translateY(16px) scale(0.96);
      transition:opacity .22s ease, transform .22s ease;
      transition-delay:0s;
    }

    .tier-row{
      display:flex; align-items:flex-start; gap:14px;
      padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.04);
      opacity:0; transform:translateX(-10px);
      transition:opacity .25s ease, transform .25s ease;
    }
    #tierModal.open .tier-row{ opacity:1; transform:translateX(0); }
    .tier-row:last-child{ border-bottom:none; }

    #tierModalInner h2{
      margin:0 0 20px 0; font-size:18px; font-weight:800;
      color:#fff; letter-spacing:1px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:space-between;
    }
    #tierModalClose{
      background:none; border:none; color:rgba(255,255,255,0.45);
      font-size:22px; cursor:pointer; line-height:1; padding:0 2px;
      transition:color .15s, transform .2s ease;
    }
    #tierModalClose:hover{ color:#fff; transform:rotate(90deg); }

    .tier-dot{
      width:14px; height:14px; border-radius:50%; flex-shrink:0; margin-top:3px;
      box-shadow:0 0 8px currentColor;
    }
    .tier-name{ font-weight:800; font-size:14px; min-width:76px; flex-shrink:0; }
    .tier-name[data-tier="Netherite"]{ color:#7a7a8a; }
    .tier-name[data-tier="Diamond"]  { color:#00BFFF; }
    .tier-name[data-tier="Emerald"]  { color:#50C878; }
    .tier-name[data-tier="Gold"]     { color:#cca800; }
    .tier-name[data-tier="Iron"]     { color:#8b8b8b; }
    .tier-name[data-tier="Copper"]   { color:#B87333; }
    .tier-name[data-tier="Coal"]     { color:#888; }
    body.mono .tier-name             { color:#fff !important; }
    .tier-desc{ font-size:13px; color:rgba(255,255,255,0.65); line-height:1.5; font-weight:500; }
    body.mono .tier-desc{ color:rgba(255,255,255,0.5); }

    /* mono overrides */
    body.mono{ background:#000; color:#fff; }
    body.mono header{ background:#000; border-bottom:1px solid #111; animation:none; }
    body.mono .gold-glow{ border-color:#fff !important; box-shadow:0 0 14px #fff, 0 0 32px rgba(255,255,255,0.18) !important; background:transparent !important; }
    body.mono .silver-glow{ border-color:#fff !important; box-shadow:0 0 10px #fff, 0 0 24px rgba(255,255,255,0.14) !important; background:transparent !important; }
    body.mono .bronze-glow{ border-color:#fff !important; box-shadow:0 0 10px #fff, 0 0 20px rgba(255,255,255,0.12) !important; background:transparent !important; }
    body.mono .no-players{ border:2px dashed rgba(255,255,255,0.18); color:#fff; background: rgba(255,255,255,0.03); }
    body.mono .tab{ color:#ddd; } body.mono .tab.active{ color:#fff; border-bottom-color:#fff; }
    body.mono #searchInput{ background:#000; border:1px solid #222; color:#fff; }
    body.mono .player{ background:#000; border:1px solid #111; color:#fff; }
    body.mono .backBtn{ background:#000; color:#fff; border:1px solid #fff; box-shadow:none; }
    body.mono #tierModalInner{ background:#0a0a0a; border-color:#333; box-shadow:0 32px 80px rgba(0,0,0,0.9), 0 0 40px rgba(255,255,255,0.04); }
    body.mono #tierModalBackdrop{ background:rgba(0,0,0,0.88); }
    body.mono .tier-row{ border-bottom-color:rgba(255,255,255,0.08); }
    body.mono .tier-desc{ color:rgba(255,255,255,0.55); }
    body.mono #tierModalClose{ color:rgba(255,255,255,0.4); }
    body.mono #tierModalClose:hover{ color:#fff; }

    @media (max-width:720px){
      header{ padding:24px 12px; } .logo{ font-size:26px; } #searchInput{ width:92%; } .player{ padding:12px; gap:10px; } .player-head{ width:44px;height:44px; }
    }
    @media (max-width:520px){
      .tabs{ gap:8px; } .subtitle{ font-size:12px; } .number{ display:none; } .right{ display:none; }
    }

    #comparePage{ display:none; max-width:700px; margin:auto; padding:20px; opacity:0; transform:translateY(28px) scale(0.98); transition:opacity .35s ease, transform .35s ease; }
    #comparePage.show{ opacity:1; transform:translateY(0) scale(1); }
    .compare-selectors{ display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; justify-content:center; align-items:center; }
    .compare-search-wrap{ flex:1; min-width:140px; max-width:220px; position:relative; }
    .compare-search-input{
      width:100%; padding:10px 14px; border-radius:10px; border:1px solid rgba(255,20,147,0.18);
      background:#0f0f12; color:white; font-weight:700; font-size:14px; outline:none; cursor:text; box-sizing:border-box;
    }
    .compare-search-input::placeholder{ color:rgba(255,255,255,0.35); font-weight:500; }
    .compare-dropdown{
      display:none; position:fixed; z-index:9999;
      background:#0f0f12; border:1px solid rgba(255,20,147,0.18); border-radius:10px;
      max-height:200px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,0.8);
    }
    .compare-dropdown.open{ display:block; }
    .compare-dropdown-item{
      padding:9px 14px; cursor:pointer; font-size:13px; font-weight:600; color:#eaeaea;
      transition:background .15s; display:flex; align-items:center; gap:8px;
    }
    .compare-dropdown-item:hover, .compare-dropdown-item.selected{ background:rgba(255,20,147,0.12); color:white; }
    .compare-dropdown-item img{ width:24px; height:24px; border-radius:6px; }
    .compare-dropdown-empty{ padding:10px 14px; font-size:13px; color:rgba(255,255,255,0.35); font-style:italic; }
    body.mono .compare-search-input{ background:#000; border-color:#333; color:#fff; }
    body.mono .compare-dropdown{ background:#111; border-color:#444; }
    body.mono .compare-dropdown-item:hover, body.mono .compare-dropdown-item.selected{ background:rgba(255,255,255,0.08); }
    .compare-vs{ font-weight:900; font-size:20px; color:var(--accent-pink); flex-shrink:0; }
    body.mono .compare-vs{ color:#fff; }
    .compare-btn{
      padding:10px 22px; border-radius:10px; border:none; background:var(--accent-pink); color:white;
      font-weight:800; cursor:pointer; font-size:14px; transition:all .2s; box-shadow:0 8px 20px rgba(255,20,147,0.18);
      width:100%;
    }
    .compare-btn:hover{ background:var(--accent-muted); }
    .compare-btn:disabled{ opacity:0.5; cursor:not-allowed; }
    body.mono .compare-btn{ background:#fff; color:#000; box-shadow:none; }
    .compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .compare-card{ background:var(--card-dark); border-radius:12px; padding:18px; border:1px solid rgba(255,20,147,0.08); opacity:0; transform:translateY(12px); transition:opacity .4s ease, transform .4s ease; }
    .compare-card.visible{ opacity:1; transform:translateY(0); }
    body.mono .compare-card{ background:#000; border-color:#222; }
    .compare-card h3{ margin:0 0 14px 0; display:flex; align-items:center; gap:10px; font-size:15px; }
    .compare-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px; }
    .compare-row:last-child{ border-bottom:none; }
    .compare-row .label{ opacity:0.6; font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.5px; }
    .compare-row .val{ font-weight:800; font-size:15px; }
    .compare-winner{ color:limegreen; }
    .compare-loser{ opacity:0.45; }
    .compare-bar-wrap{ margin:8px 0 14px 0; }
    .compare-bar-track{ background:var(--muted); height:6px; border-radius:6px; overflow:hidden; margin-top:4px; }
    .compare-bar-fill{ height:100%; border-radius:6px; transition:width 1s ease; }

    function openTierGuide(){
      const list = document.getElementById('tierModalList');
      list.innerHTML = '';
      tierGuideData.forEach((t, i) => {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.style.transitionDelay = (0.06 + i * 0.055) + 's';
        row.innerHTML = `
          <div class="tier-dot" style="background:${t.color};color:${t.color};border:1px solid rgba(255,255,255,0.15);"></div>
          <div class="tier-name" data-tier="${t.name}">${t.name}</div>
          <div class="tier-desc">${t.desc}</div>
        `;
        list.appendChild(row);
      });
      const modal = document.getElementById('tierModal');
      modal.classList.remove('closing');
      modal.style.display = 'flex';
      // Force a reflow so the browser registers the initial state before open is added
      modal.getBoundingClientRect();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          modal.classList.add('open');
        });
      });
      const scrollBarWidth = window.innerWidth - document.documentElement.clientWidth;
      const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
      document.body.style.paddingRight = scrollbarWidth + 'px';
      document.body.style.overflow = 'hidden';
      document.body.style.paddingRight = (window.innerWidth - document.documentElement.clientWidth) + 'px';
      document.body.style.paddingRight = scrollBarWidth + 'px';
    }

    function closeTierGuide(){
      const modal = document.getElementById('tierModal');
      modal.classList.add('closing');
      // Clear row delays so they don't delay the close
      modal.querySelectorAll('.tier-row').forEach(r => r.style.transitionDelay = '0s');
      setTimeout(() => {
        modal.classList.remove('open', 'closing');
        modal.style.display = 'none';
        document.body.style.overflow = '';
        document.body.style.paddingRight = '';
        document.body.style.paddingRight = '';
      }, 300);

      uhc:   { Killedbycrab:"Gold", RealO75:"Gold", Aftlow:"Gold", Knoxy5316:"Iron", Jai_B37:"Iron", bubbler2009:"Copper", "WARDY B33":"Copper", Cocotime15:"Copper", w85544534:"Emerald", Terroralex10:"Iron", SadInFusIOns:"Copper", Ushindo:"Iron", Mason20539:"Iron" },
      mace:  { Killedbycrab:"Diamond", RealO75:"Iron", Aftlow:"Gold", Knoxy5316:"Copper", Jai_B37:"Copper", bubbler2009:"Coal", "WARDY B33":"Copper", Cocotime15:"Copper", w85544534:"Gold", Terroralex10:"Copper", SadInFusIOns:"Coal", Ushindo:"Copper", Mason20539:"Copper" },
      spear: { Killedbycrab:"Gold", RealO75:"Iron", Aftlow:"Diamond", Knoxy5316:"Copper", Jai_B37:"Iron", bubbler2009:"Copper", "WARDY B33":"Copper", Cocotime15:"Copper", w85544534:"Iron", Terroralex10:"Copper", SadInFusIOns:"Copper", Ushindo:"Copper", Mason20539:"Copper" },
      overall:{ Killedbycrab:"Emerald", RealO75:"Gold", Aftlow:"Emerald", Knoxy5316:"Copper", Jai_B37:"Iron", bubbler2009:"Copper", "WARDY B33":"Copper", Cocotime15:"Copper", w85544534:"Emerald", Terroralex10:"Copper", SadInFusIOns:"Copper", Ushindo:"Iron", Mason20539:"Gold" }
    };

    const tierColors = {
      Netherite:'#4a4a52', Diamond:'#00BFFF', Emerald:'#50C878', Gold:'#FFD700', Iron:'#8b8b8b', Copper:'#B87333', Coal:'#1a1a1a', 'Unranked':'#888'

    };

    const countryNames = { gb:'UK', se:'Sweden', za:'South Africa', dk:'Denmark', nl:'Netherlands' };

    function getFlagImg(code, size=16){
      return `<img src="https://flagcdn.com/w40/${code}.png" alt="${countryNames[code]||code}" title="${countryNames[code]||code}" style="height:${size}px;width:auto;border-radius:2px;vertical-align:middle;display:inline-block;">`;
    }

    function updateOverall(){
      const overall = {};
      for(const mode in playerStats){
        if(mode === 'overall') continue;
        const list = playerStats[mode] || {};
        for(const p in list){
          if(!overall[p]) overall[p] = {wins:0,kills:0,deaths:0};
          const s = list[p];
          overall[p].wins += (s.wins || 0);
          overall[p].kills += (s.kills || 0);
          overall[p].deaths += (s.deaths || 0);
        }
      }
      playerStats.overall = overall;
    }

    function getOrderedPlayers(mode){
      if(mode === 'overall') updateOverall();
      const data = playerStats[mode] || {};
      const entries = Object.entries(data);

      const tierPriority = { 'Netherite':7, 'Diamond':6, 'Emerald':5, 'Gold':4, 'Iron':3, 'Copper':2, 'Coal':1, 'Unranked':0 };

      const computed = entries.map(([name, stats]) => {
        const s = stats || {wins:0,kills:0,deaths:0};
        const tier = customTiers[mode]?.[name] || "Unranked";
        const kd = (s.deaths === 0) ? s.kills : (s.kills / s.deaths);
        const score = (s.wins * 10) + s.kills + (kd * 5);
        return { name, stats: s, tier, score };
      });

      computed.sort((a,b) => {
        const tDiff = (tierPriority[b.tier] || 0) - (tierPriority[a.tier] || 0);
        if(tDiff !== 0) return tDiff;

        if(a.tier === 'Unranked' && b.tier === 'Unranked'){
          if(b.score !== a.score) return b.score - a.score;
          if(b.stats.wins !== a.stats.wins) return b.stats.wins - a.stats.wins;
          if(b.stats.kills !== a.stats.kills) return b.stats.kills - a.stats.kills;
          return a.stats.deaths - b.stats.deaths;
        }

        if(b.score !== a.score) return b.score - a.score;
        if(b.stats.wins !== a.stats.wins) return b.stats.wins - a.stats.wins;
        if(b.stats.kills !== a.stats.kills) return b.stats.kills - a.stats.kills;
        return a.stats.deaths - b.stats.deaths;
      });

      return computed.map(c => c.name);
    }

    function createPlayers(mode){
      if(mode === 'overall') updateOverall();
      const container = document.getElementById(mode);
      if(!container) return;
      const players = getOrderedPlayers(mode).filter(name => showRetired || !retired.includes(name));
      container.innerHTML = '';

      const countDiv = document.createElement('div');
      countDiv.style.cssText = 'font-size:12px;font-weight:600;opacity:0.5;text-align:right;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;';
      countDiv.textContent = players.length + ' player' + (players.length !== 1 ? 's' : '');
      container.appendChild(countDiv);

      players.forEach((name, i) => {
        let glow = '', numberClass = '', podiumClass = '', crownHtml = '';
        if(i===0){ glow='gold-glow'; numberClass='gold'; podiumClass='top1';
          crownHtml = `<svg class="crown" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="gold" d="M2 7l3 9h14l3-9-6 3-4-5-4 5-6-3z"/></svg>`;
        }
        else if(i===1){ glow='silver-glow'; numberClass='silver'; podiumClass='top2'; }
        else if(i===2){ glow='bronze-glow'; numberClass='bronze'; podiumClass='top3'; }

        const tier = customTiers[mode]?.[name] || "Unranked";
        const stats = (playerStats[mode] || {})[name] || {wins:0,kills:0,deaths:0};

        const kdVal = stats.deaths === 0 ? (stats.kills > 0 ? Infinity : 0) : stats.kills / stats.deaths;
        const fireHtml = (kdVal === Infinity || kdVal >= 2) ? `<span title="Hot streak!" style="font-size:14px;line-height:1;">🔥</span>` : '';

        const isRetired = retired.includes(name);
        const card = document.createElement('div');
        card.className = `player ${glow} ${podiumClass}`;
        card.style.animationDelay = (i * 0.06) + 's';
        if(isRetired) card.style.opacity = '0.45';
        card.onclick = () => openProfile(name, mode);

        const numberSpan = document.createElement('span');
        numberSpan.className = 'number ' + numberClass;
        numberSpan.textContent = '#' + (i + 1);

        const playerContent = document.createElement('div');
        playerContent.className = 'player-content';

        const retiredBadge = isRetired ? `<span style="font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:#333;color:#aaa;margin-left:4px;">🏆 Retired</span>` : '';

        const badgeHtml = (tier && tier !== 'Unranked') ?
          `<span class="tier-badge" title="${tier} tier" style="background:${tierColors[tier]||'#888'}; color:${(tier==='Gold')?'#000':'#fff'};">${tier}</span>` : '';

        const flagHtml = playerCountry[name] ? getFlagImg(playerCountry[name], 12) : '';

        playerContent.innerHTML = `
          <div class="left">
            <img src="${getAvatar(name)}" alt="${name} avatar" class="player-head">
            <div class="info">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                <b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name}</b>
                ${flagHtml}${fireHtml}
                ${crownHtml}
                ${badgeHtml}${retiredBadge}
              </div>
              <div class="mini-stats"><strong>W:</strong> ${stats.wins} &nbsp; <strong>K:</strong> ${stats.kills} &nbsp; <strong>D:</strong> ${stats.deaths}</div>
            </div>
          </div>
          <div class="right">
            <div style="font-weight:700;font-size:13px;opacity:.9;">K/D: <span style="color:${kdVal===Infinity||kdVal>=2?'limegreen':kdVal>=1?'yellow':'red'}">${kdVal===Infinity?'∞':kdVal===0?'0.00':kdVal.toFixed(2)}</span></div>
          </div>
        `;

        card.appendChild(numberSpan);
        card.appendChild(playerContent);
        container.appendChild(card);
      });

      if(players.length === 0){
        const div = document.createElement('div');
        div.className = 'no-players';
        div.textContent = 'No players found';
        container.appendChild(div);
      }
    }

    function openProfile(name, mode){
      const stats = (playerStats[mode] || {})[name];
      const tierColorsLocal = tierColors;

      if(!stats){
        const color = monoMode ? '#fff' : '#ff99cc';
        document.getElementById('profileContent').innerHTML = `<p style="color:${color}; font-weight:bold;">No stats for ${name} in ${mode}.</p>`;
      } else {
        const ranking = getOrderedPlayers(mode);
        const rank = ranking.indexOf(name) + 1;
        const kd = stats.deaths === 0 ? '∞' : (stats.kills / stats.deaths).toFixed(2);
        const tier = customTiers[mode]?.[name] || "Unranked";
        const tierColor = tierColorsLocal[tier] || '#888';

        else if(Number(kd) >= 1) kdColor = 'yellow';

        const crownHtml = (rank === 1) ? `<svg class="crown" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="gold" d="M2 7l3 9h14l3-9-6 3-4-5-4 5-6-3z"/></svg>` : '';
        const retiredProfileBadge = retired.includes(name) ? `<span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#333;color:#aaa;margin-left:6px;">🏆 Retired</span>` : '';
        const profileFlag = playerCountry[name] ? getFlagImg(playerCountry[name], 16) : '';

        document.getElementById('profileContent').innerHTML = `

            <div>K/D: <span style="color:${kdColor}">${kd}</span></div>

          <p style="margin:6px 0;"><b>Wins:</b> <strong>${stats.wins}</strong></p>
          <div class="stat-bar"><div class="stat-fill" id="winsBar" style="background:${tierColor}"></div></div>
          <p style="margin:6px 0;"><b>Kills:</b> <strong>${stats.kills}</strong></p>

          <p style="margin:6px 0;"><b>Deaths:</b> <strong>${stats.deaths}</strong></p>
          <div class="stat-bar"><div class="stat-fill" id="deathsBar" style="background:${tierColor}"></div></div>
        `;
        setTimeout(()=> animateBars(stats, tierColor), 20);
      }

      document.querySelector('.tabs').style.display = 'none';
      document.querySelector('.container').style.display = 'none';
      document.getElementById('searchInput').style.display = 'none';
      document.getElementById('retiredToggle').style.display = 'none';
      const profile = document.getElementById('profilePage');
      profile.style.display = 'block';
      setTimeout(()=> { profile.classList.add('show'); profile.setAttribute('aria-hidden','false'); }, 10);
    }

    function animateBars(stats, color){
      const max = Math.max(stats.wins || 0, stats.kills || 0, stats.deaths || 0, 1);
      const mapping = [{id:'winsBar',key:'wins'},{id:'killsBar',key:'kills'},{id:'deathsBar',key:'deaths'}];
      mapping.forEach((m, idx) => {
        const bar = document.getElementById(m.id);
        if(!bar) return;
        bar.style.width = '0%';
        bar.style.background = color;
        void bar.offsetWidth;
        setTimeout(()=> {
          const value = stats[m.key] || 0;
          bar.style.width = Math.round((value / max) * 100) + '%';
        }, idx * 200);
      });
    }

    function goBack(){
      const profile = document.getElementById('profilePage');
      profile.classList.remove('show');
      profile.setAttribute('aria-hidden','true');
      setTimeout(()=>{
        profile.style.display = 'none';
        document.querySelector('.tabs').style.display = 'flex';
        document.querySelector('.container').style.display = 'block';
        document.getElementById('searchInput').style.display = 'inline-block';
        document.getElementById('retiredToggle').style.display = 'inline-block';
      }, 260);

    function refreshPage(){
      location.reload();
    }

    function searchPlayers(){
      const value = document.getElementById('searchInput').value.trim().toLowerCase();
      const active = document.querySelector('.mode.active');
      if(!active) return;
      active.querySelectorAll('.no-players').forEach(np => np.remove());

      const players = Array.from(active.querySelectorAll('.player'));
      players.forEach(p => {
        const nameElem = p.querySelector('b');
        const name = nameElem ? nameElem.textContent.toLowerCase() : '';
        p.style.display = name.includes(value) ? 'flex' : 'none';
      });

      const visible = players.filter(p => p.style.display !== 'none');
      if(visible.length === 0){
        const div = document.createElement('div');
        div.className = 'no-players';
        div.textContent = 'No players found';
        active.appendChild(div);
      }
    }

    function showMode(mode, btn){
      const activeTab = document.querySelector('.tab.active');
      if(activeTab === btn) return;

      hideCompare();
      document.getElementById('searchInput').style.display = 'inline-block';
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
      const el = document.getElementById(mode);
      if(el) el.classList.add('active');

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if(btn) btn.classList.add('active');

      document.querySelector('.container').style.display = 'block';
      createPlayers(mode);
    }

    let compareMode = 'overall';

    function showCompare(btn){
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if(btn) btn.classList.add('active');
      document.querySelector('.container').style.display = 'none';
      document.getElementById('searchInput').style.display = 'none';
      document.getElementById('profilePage').style.display = 'none';
      const cp = document.getElementById('comparePage');
      cp.style.display = 'block';
      setTimeout(()=>{ cp.classList.add('show'); cp.setAttribute('aria-hidden','false'); }, 10);
      populateCompareSelects();
    }

    function hideCompare(){
      const cp = document.getElementById('comparePage');
      cp.classList.remove('show');
      cp.setAttribute('aria-hidden','true');
      setTimeout(()=>{ cp.style.display = 'none'; }, 260);
    }

    function setCompareMode(mode, btn){
      compareMode = mode;
      document.querySelectorAll('#compareModeRow button').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      document.getElementById('compareResult').innerHTML = '';
      populateCompareSelects();
    }

    let compareP1Selected = '';
    let compareP2Selected = '';
    let comparePlayers = [];

    function populateCompareSelects(){
      if(compareMode === 'overall') updateOverall();
      comparePlayers = Object.keys(playerStats[compareMode] || {}).filter(p => showRetired || !retired.includes(p));
      comparePlayers.sort();
      compareP1Selected = '';
      compareP2Selected = '';
      document.getElementById('compareSearch1').value = '';
      document.getElementById('compareSearch2').value = '';
      buildDropdown(1, comparePlayers);
      buildDropdown(2, comparePlayers);
    }

    function buildDropdown(num, players){
      const dd = document.getElementById('compareDropdown' + num);
      const input = document.getElementById('compareSearch' + num);
      const search = input.value.toLowerCase();
      const filtered = players.filter(p => p.toLowerCase().includes(search));
      dd.innerHTML = '';
      if(filtered.length === 0){
        dd.innerHTML = `<div class="compare-dropdown-empty">No players found</div>`;
        return;
      }
      filtered.forEach(p => {
        const item = document.createElement('div');
        item.className = 'compare-dropdown-item' + (
          (num === 1 && p === compareP1Selected) || (num === 2 && p === compareP2Selected) ? ' selected' : ''
        );
        const flag = playerCountry[p] ? getFlagImg(playerCountry[p], 12) : '';
        item.innerHTML = `<img src="${getAvatar(p, 24)}" alt="${p}">${flag}<span>${p}</span>`;
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          selectComparePlayer(num, p);
        });
        dd.appendChild(item);
      });
    }

    function selectComparePlayer(num, name){
      if(num === 1){
        compareP1Selected = name;
        document.getElementById('compareSearch1').value = name;
      } else {
        compareP2Selected = name;
        document.getElementById('compareSearch2').value = name;
      }
      document.getElementById('compareDropdown' + num).classList.remove('open');
    }

    function filterCompareList(num){
      buildDropdown(num, comparePlayers);
      positionDropdown(num);
      document.getElementById('compareDropdown' + num).classList.add('open');
      if(num === 1) compareP1Selected = '';
      else compareP2Selected = '';
    }

    function positionDropdown(num){
      const input = document.getElementById('compareSearch' + num);
      const dd = document.getElementById('compareDropdown' + num);
      const rect = input.getBoundingClientRect();
      dd.style.top = (rect.bottom + 4) + 'px';
      dd.style.left = rect.left + 'px';
      dd.style.width = rect.width + 'px';
    }

    function showCompareDropdown(num){
      buildDropdown(num, comparePlayers);
      positionDropdown(num);
      document.getElementById('compareDropdown' + num).classList.add('open');
    }

    function hideCompareDropdown(num){
      setTimeout(() => {
        document.getElementById('compareDropdown' + num).classList.remove('open');
        const input = document.getElementById('compareSearch' + num);
        const selected = num === 1 ? compareP1Selected : compareP2Selected;
        if(!selected) input.value = '';
      }, 150);
    }

    function runCompare(){
      const btn = document.querySelector('.compare-btn');
      if(btn.disabled) return;
      btn.disabled = true;
      setTimeout(() => { btn.disabled = false; }, 1000);
      if(compareMode === 'overall') updateOverall();
      const p1 = compareP1Selected;
      const p2 = compareP2Selected;
      if(!p1 || !p2 || p1 === p2 || p1 === '' || p2 === ''){
        document.getElementById('compareResult').innerHTML = `<div class="no-players">Pick two different players!</div>`;
        return;
      }
      const s1 = (playerStats[compareMode] || {})[p1] || {wins:0,kills:0,deaths:0};
      const s2 = (playerStats[compareMode] || {})[p2] || {wins:0,kills:0,deaths:0};
      const t1 = customTiers[compareMode]?.[p1] || 'Unranked';
      const t2 = customTiers[compareMode]?.[p2] || 'Unranked';
      const c1 = tierColors[t1] || '#888';
      const c2 = tierColors[t2] || '#888';

      const kd1 = s1.deaths === 0 ? (s1.kills > 0 ? Infinity : 0) : s1.kills / s1.deaths;
      const kd2 = s2.deaths === 0 ? (s2.kills > 0 ? Infinity : 0) : s2.kills / s2.deaths;
      const kd1str = kd1 === Infinity ? '∞' : kd1.toFixed(2);
      const kd2str = kd2 === Infinity ? '∞' : kd2.toFixed(2);

      const r1 = getOrderedPlayers(compareMode).indexOf(p1) + 1;
      const r2 = getOrderedPlayers(compareMode).indexOf(p2) + 1;

      function winClass(a, b, higherIsBetter = true){
        if(a === b) return ['',''];
        const aWins = higherIsBetter ? a > b : a < b;
        return aWins ? ['compare-winner','compare-loser'] : ['compare-loser','compare-winner'];
      }

      const [wc1k, wc2k] = winClass(s1.kills, s2.kills);
      const [wc1w, wc2w] = winClass(s1.wins, s2.wins);
      const [wc1d, wc2d] = winClass(s1.deaths, s2.deaths, false);
      const [wc1kd, wc2kd] = winClass(kd1, kd2);

      const maxKills = Math.max(s1.kills, s2.kills, 1);
      const maxWins = Math.max(s1.wins, s2.wins, 1);
      const maxDeaths = Math.max(s1.deaths, s2.deaths, 1);

      document.getElementById('compareResult').innerHTML = `
        <div class="compare-grid">
          <div class="compare-card" id="ccard1">
            <h3>
              <img src="${getAvatar(p1,40)}" style="width:40px;height:40px;border-radius:8px;">
              <span style="color:${c1}">${p1} ${playerCountry[p1] ? getFlagImg(playerCountry[p1],12) : ''}</span>
              <span style="font-size:12px;opacity:0.6;font-weight:600;">#${r1}</span>
            </h3>
            <div class="compare-row"><span class="label">Tier</span><span class="val" style="color:${c1}">${t1}</span></div>
            <div class="compare-row"><span class="label">Wins</span><span class="val ${wc1w}">${s1.wins}</span></div>
            <div class="compare-bar-wrap"><div class="compare-bar-track"><div class="compare-bar-fill" id="b1w" style="background:${c1};width:0%"></div></div></div>
            <div class="compare-row"><span class="label">Kills</span><span class="val ${wc1k}">${s1.kills}</span></div>
            <div class="compare-bar-wrap"><div class="compare-bar-track"><div class="compare-bar-fill" id="b1k" style="background:${c1};width:0%"></div></div></div>
            <div class="compare-row"><span class="label">Deaths</span><span class="val ${wc1d}">${s1.deaths}</span></div>
            <div class="compare-bar-wrap"><div class="compare-bar-track"><div class="compare-bar-fill" id="b1d" style="background:${c1};width:0%"></div></div></div>
            <div class="compare-row"><span class="label">K/D</span><span class="val ${wc1kd}" style="color:${kd1===Infinity||kd1>=2?'limegreen':kd1>=1?'yellow':'red'}">${kd1str}</span></div>
          </div>
          <div class="compare-card" id="ccard2">
            <h3>
              <img src="${getAvatar(p2,40)}" style="width:40px;height:40px;border-radius:8px;">
              <span style="color:${c2}">${p2} ${playerCountry[p2] ? getFlagImg(playerCountry[p2],12) : ''}</span>
              <span style="font-size:12px;opacity:0.6;font-weight:600;">#${r2}</span>
            </h3>
            <div class="compare-row"><span class="label">Tier</span><span class="val" style="color:${c2}">${t2}</span></div>
            <div class="compare-row"><span class="label">Wins</span><span class="val ${wc2w}">${s2.wins}</span></div>
            <div class="compare-bar-wrap"><div class="compare-bar-track"><div class="compare-bar-fill" id="b2w" style="background:${c2};width:0%"></div></div></div>
            <div class="compare-row"><span class="label">Kills</span><span class="val ${wc2k}">${s2.kills}</span></div>
            <div class="compare-bar-wrap"><div class="compare-bar-track"><div class="compare-bar-fill" id="b2k" style="background:${c2};width:0%"></div></div></div>
            <div class="compare-row"><span class="label">Deaths</span><span class="val ${wc2d}">${s2.deaths}</span></div>
            <div class="compare-bar-wrap"><div class="compare-bar-track"><div class="compare-bar-fill" id="b2d" style="background:${c2};width:0%"></div></div></div>
            <div class="compare-row"><span class="label">K/D</span><span class="val ${wc2kd}" style="color:${kd2===Infinity||kd2>=2?'limegreen':kd2>=1?'yellow':'red'}">${kd2str}</span></div>
          </div>
        </div>
      `;

      setTimeout(()=>{
        document.getElementById('ccard1').classList.add('visible');
        setTimeout(()=> document.getElementById('ccard2').classList.add('visible'), 80);
        setTimeout(()=>{
          document.getElementById('b1w').style.width = Math.round((s1.wins/maxWins)*100)+'%';
          document.getElementById('b2w').style.width = Math.round((s2.wins/maxWins)*100)+'%';
          document.getElementById('b1k').style.width = Math.round((s1.kills/maxKills)*100)+'%';
          document.getElementById('b2k').style.width = Math.round((s2.kills/maxKills)*100)+'%';
          document.getElementById('b1d').style.width = Math.round((s1.deaths/maxDeaths)*100)+'%';
          document.getElementById('b2d').style.width = Math.round((s2.deaths/maxDeaths)*100)+'%';
        }, 200);
      }, 30);
    }

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement.tagName.toLowerCase();
      const isTyping = tag === 'input' || tag === 'textarea';

      if(e.key === 'Escape'){
        if(document.getElementById('tierModal').classList.contains('open')){
          closeTierGuide();
          return;
        }
        const profile = document.getElementById('profilePage');
        const comparePage = document.getElementById('comparePage');
        if(profile && profile.style.display !== 'none') {
          goBack();
        } else if(comparePage && comparePage.classList.contains('show')) {
          const overallTab = document.querySelector('.tabs button');
          showMode('overall', overallTab);
        } else if(!isTyping) {
          const search = document.getElementById('searchInput');
          if(search && search.value) {
            search.value = '';
            searchPlayers();
          }
        } else {
          document.activeElement.blur();
        }
      }

      if(e.key === '/' && !isTyping) {
        e.preventDefault();
        const search = document.getElementById('searchInput');
        if(search && search.style.display !== 'none') {
          search.focus();
          search.select();
        }
      }

      if(!isTyping && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const tabMap = { '1':'overall','2':'sword','3':'axe','4':'uhc','5':'mace','6':'spear' };
        if(tabMap[e.key]) {
          const tabs = document.querySelectorAll('.tabs .tab');
          const modeIndex = Object.keys(tabMap).indexOf(e.key);
          if(tabs[modeIndex]) tabs[modeIndex].click();
        }
        if(e.key === '7') {
          const compareTab = document.querySelector('.tabs .tab:last-child');
          if(compareTab) compareTab.click();
        }
      }
    });


    window.addEventListener('DOMContentLoaded', () => {



      const modes = ['sword','axe','uhc','mace','spear'];
      modes.forEach(m => createPlayers(m));
      createPlayers('overall');

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const overallTab = document.querySelector('.tabs button');
      if(overallTab) overallTab.classList.add('active');

      document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
      const overallDiv = document.getElementById('overall');
      if(overallDiv) overallDiv.classList.add('active');

      thumb.style.background = '#000';
    });
  </script>

</body>
</html>
