<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Quipalite MC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ---------- Base ---------- */
    :root{
      --accent-pink:#ff1493;
      --accent-pink-2:#ff66cc;
      --bg-dark:#000;
      --card-dark:#111;
      --muted:#1a1a1a;
    }

    body{
      margin:0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:var(--bg-dark);
      color:white;
      overflow-x:hidden;
      transition:all 0.28s ease;
    }

    header{
      text-align:center;
      padding:45px 20px;
      font-size:44px;
      font-weight:900;
      letter-spacing:3px;
      background:linear-gradient(90deg,#ff2db2,#ff66cc,#ff1493,#ff2db2);
      background-size:300% 300%;
      animation:bannerMove 5s ease infinite;
      border-bottom:3px solid var(--accent-pink-2);
      position:relative;
    }
    @keyframes bannerMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .theme-toggle{
      position:absolute;
      top:15px;
      right:15px;
      width:50px;
      height:24px;
      border-radius:12px;
      background:#fff;
      cursor:pointer;
      display:flex;
      align-items:center;
      padding:2px;
      box-sizing:border-box;
    }
    .theme-toggle .toggle-thumb{
      width:20px;height:20px;border-radius:50%;
      transition:transform 0.25s ease, background 0.25s ease;
      background:#000;
      transform:translateX(0);
    }

    .tabs{
      text-align:center;
      margin:20px 0;
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .tab{
      background:var(--card-dark);
      border:1px solid var(--accent-pink);
      color:white;
      padding:6px 12px;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
      transition:0.15s ease;
    }
    .tab:hover{ transform:scale(1.05); }
    .tab.active{ background:var(--accent-pink); color:#000; }

    #searchInput{
      width:250px;
      padding:10px;
      border-radius:8px;
      border:1px solid var(--accent-pink);
      background:var(--card-dark);
      color:white;
      font-weight:bold;
      outline:none;
      transition:all 0.2s ease;
    }

    .container{ max-width:900px; margin:auto; padding:20px; min-height:200px; }

    .mode{ display:none; opacity:0; transition:opacity 0.28s ease; }
    .mode.active{ display:block; opacity:1; }

    .player{
      background:var(--card-dark);
      margin:12px 0;
      padding:18px;
      border-radius:12px;
      border:1px solid var(--accent-pink);
      cursor:pointer;
      display:flex;
      align-items:center;
      position:relative;
      overflow:hidden;
      transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .player:hover{ transform:translateY(-4px) scale(1.02); box-shadow:0 0 16px var(--accent-pink); }

    .player-head{
      width:48px;height:48px;border-radius:8px;margin-right:12px;border:2px solid var(--accent-pink);flex-shrink:0;
      display:block;
      object-fit:cover;
      background:#222;
    }

    /* rank glows (default colored) */
    .gold-glow{ border-color:gold !important; box-shadow:0 0 16px gold; animation:pulseTop 1.2s infinite alternate; }
    .silver-glow{ border-color:silver !important; box-shadow:0 0 14px silver; }
    .bronze-glow{ border-color:#cd7f32 !important; box-shadow:0 0 12px #cd7f32; }
    @keyframes pulseTop{0%{box-shadow:0 0 12px gold;}100%{box-shadow:0 0 22px gold;}}

    .number{
      display:inline-block;
      padding:6px 12px;
      border-radius:50%;
      font-weight:bold;
      margin-right:12px;
      min-width:30px;
      text-align:center;
      position:relative;
      z-index:2;
      color:white;
    }
    .gold{ background:gold; color:black; }
    .silver{ background:silver; color:black; }
    .bronze{ background:#cd7f32; color:white; }

    .player-content{ opacity:0; transform:translateY(20px) scale(0.97); animation:fadeSlide 0.45s ease forwards; display:flex; align-items:center; gap:10px; }
    @keyframes fadeSlide{ to{opacity:1; transform:translateY(0) scale(1);} }

    #profilePage{ display:none; max-width:700px; margin:auto; padding:20px; opacity:0; transform:translateY(20px); transition:0.28s ease; }
    #profilePage.show{ opacity:1; transform:translateY(0); }
    #profileContent{ background:var(--card-dark); padding:20px; border-radius:12px; border:1px solid var(--accent-pink); color:white; }

    .backBtn{
      background:var(--accent-pink);
      border:none;
      padding:10px 16px;
      color:white;
      font-weight:bold;
      border-radius:8px;
      cursor:pointer;
      margin-bottom:20px;
      transition:all 0.2s ease;
    }
    .backBtn:hover{ background:var(--accent-pink-2); }

    .stat-bar{ background:var(--muted); height:8px; border-radius:6px; margin-bottom:15px; overflow:hidden; position:relative; }
    .stat-fill{ height:100%; width:0%; transition:width 1s ease; position:relative; overflow:hidden; border-radius:6px; }
    .stat-fill::after{
      content:''; position:absolute; top:0; left:-40%; width:40%; height:100%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0) 100%);
      transform:skewX(-18deg); animation:statShine 1.6s linear infinite; pointer-events:none;
    }
    @keyframes statShine{ 0%{left:-40%;} 100%{left:140%;} }
    .stat-bar::before{ content:''; position:absolute; inset:0; border-radius:6px; box-shadow:0 0 6px rgba(255,20,147,0.03) inset; pointer-events:none; }

    .no-players{
      margin-top:20px; font-size:20px; text-align:center; padding:20px;
      border:2px dashed var(--accent-pink); border-radius:12px;
      color:var(--accent-pink-2); font-weight:bold; background: rgba(255,20,147,0.07);
      display:flex; justify-content:center; align-items:center; gap:10px; animation:pulse 1.5s infinite;
    }
    .no-players::before{ content:"⚠️"; font-size:24px; }
    @keyframes pulse{ 0%,100%{box-shadow:0 0 8px var(--accent-pink);} 50%{box-shadow:0 0 16px var(--accent-pink-2);} }

    /* ---------- MONO MODE OVERRIDES ---------- */
    body.mono{ background:#000; color:#fff; }
    body.mono header{ background:#000; border-bottom:3px solid #fff; color:#fff; animation:none; }
    body.mono .tab{ background:#000; border:1px solid #fff; color:#fff; }
    body.mono .tab.active{ background:#fff; color:#000; }
    body.mono #searchInput{ background:#000; border:1px solid #fff; color:#fff; }
    body.mono .player{ background:#000; border:1px solid #fff; color:#fff; }
    body.mono .player:hover{ box-shadow:0 0 14px #fff; }
    body.mono #profileContent{ background:#000; border:1px solid #fff; color:#fff; }
    body.mono .backBtn{ background:#000; color:#fff; border:1px solid #fff; }
    body.mono .backBtn:hover{ background:#222; }
    body.mono .stat-bar{ background:#222; }
    /* make all head borders white in mono */
    body.mono .player-head{ border:2px solid #fff !important; }
    /* force glows to white so they remain visible but mono */
    body.mono .gold-glow, body.mono .silver-glow, body.mono .bronze-glow{
      border-color:#fff !important; box-shadow:0 0 16px #fff !important; animation:none;
    }
    /* no-players mono */
    body.mono .no-players{
      border:2px dashed #fff; color:#fff; background: rgba(255,255,255,0.04); box-shadow:none; animation:pulseMono 1.6s infinite;
    }
    body.mono .no-players::before{ color:#fff; }
    @keyframes pulseMono{ 0%,100%{box-shadow:0 0 8px #fff;} 50%{box-shadow:0 0 14px #fff;} }

    /* small responsive adjustments */
    @media (max-width:520px){
      header{ font-size:32px; padding:32px 12px; }
      #searchInput{ width:180px; }
      .player{ padding:12px; }
    }
  </style>
</head>
<body>

  <header>
    QUIPALITE MC
    <div class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <div class="toggle-thumb" id="toggleThumb"></div>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="modes">
    <button class="tab active" onclick="showMode('overall', this)" role="tab">Overall</button>
    <button class="tab" onclick="showMode('sword', this)" role="tab">Sword</button>
    <button class="tab" onclick="showMode('axe', this)" role="tab">Axe</button>
    <button class="tab" onclick="showMode('uhc', this)" role="tab">UHC</button>
    <button class="tab" onclick="showMode('mace', this)" role="tab">Mace</button>
    <button class="tab" onclick="showMode('spear', this)" role="tab">Spear</button>
  </div>

  <div style="text-align:center;margin-bottom:15px;">
    <input type="text" id="searchInput" placeholder="Search player..." onkeyup="searchPlayers()" aria-label="Search players">
  </div>

  <div class="container">
    <div id="overall" class="mode active" aria-live="polite"></div>
    <div id="sword" class="mode"></div>
    <div id="axe" class="mode"></div>
    <div id="uhc" class="mode"></div>
    <div id="mace" class="mode"></div>
    <div id="spear" class="mode"></div>
  </div>

  <div id="profilePage" aria-hidden="true">
    <button class="backBtn" onclick="goBack()">⬅ Back</button>
    <div id="profileContent"></div>
  </div>

  <script>
    /* ---------- Theme toggle ---------- */
    let monoMode = false;
    const thumb = document.getElementById('toggleThumb');
    function toggleTheme(){
      monoMode = !monoMode;
      document.body.classList.toggle('mono', monoMode);
      thumb.style.transform = monoMode ? 'translateX(26px)' : 'translateX(0)';
      // invert thumb color so it looks natural on white track
      thumb.style.background = monoMode ? '#fff' : '#000';
    }

    /* ---------- Avatar helper ---------- */
    function getAvatar(username, size = 48){
      // uses tabavatars.net as before (suitable for MC heads)
      return `https://tabavatars.net/avatar/?username=${encodeURIComponent(username)}&size=${size}&type=head`;
    }

    /* ---------- Data ---------- */
    const playerStats = {
      sword: {
        RealO75:{wins:11,kills:33,deaths:7},
        Jai_B37:{wins:1,kills:3,deaths:1},
        skull_shredder30:{wins:1,kills:3,deaths:1},
        Killedbycrab:{wins:1,kills:6,deaths:6},
        Knoxy5316:{wins:1,kills:7,deaths:24},
        EggyCactus78246:{wins:1,kills:3,deaths:0},
        Aftlow:{wins:2,kills:8,deaths:10},
        Ushindo:{wins:0,kills:1,deaths:3},
        LiamTheLemur:{wins:0,kills:0,deaths:3},
        SadInFusIOns:{wins:1,kills:4,deaths:5},
        Cocotime15:{wins:1,kills:3,deaths:3}
      },
      axe: {
        RealO75:{wins:2,kills:6,deaths:2},
        Killedbycrab:{wins:2,kills:6,deaths:1},
        Jai_B37:{wins:1,kills:3,deaths:0},
        skull_shredder30:{wins:0,kills:1,deaths:3},
        "Yearly-scuff81":{wins:0,kills:0,deaths:3},
        Knoxy5316:{wins:0,kills:1,deaths:6},
        Ushindo:{wins:0,kills:1,deaths:3},
        Aftlow:{wins:1,kills:3,deaths:0}
      },
      uhc: {
        Killedbycrab:{wins:1,kills:3,deaths:0},
        "Yearly-scuff81":{wins:0,kills:0,deaths:3}
      },
      mace: {
        Killedbycrab:{wins:9,kills:27,deaths:5},
        "Yearly-scuff81":{wins:0,kills:3,deaths:15},
        Aftlow:{wins:1,kills:3,deaths:3},
        Knoxy5316:{wins:1,kills:3,deaths:19},
        EggyCactus78246:{wins:1,kills:3,deaths:0},
        LiamTheLemur:{wins:0,kills:0,deaths:1},
        RealO75:{wins:1,kills:3,deaths:0},
        Cocotime15:{wins:1,kills:3,deaths:0}
      },
      spear: {
        Killedbycrab:{wins:1,kills:3,deaths:0},
        Aftlow:{wins:2,kills:6,deaths:1},
        "Yearly-scuff81":{wins:0,kills:1,deaths:6},
        Cocotime15:{wins:0,kills:0,deaths:3}
      }
    };

    const customTiers = {
      sword:{Killedbycrab:"Gold"},
      axe:{Killedbycrab:"Emerald"},
      uhc:{Killedbycrab:"Gold"},
      mace:{Killedbycrab:"Diamond"},
      spear:{Killedbycrab:"Gold"},
      overall:{Killedbycrab:"Emerald"}
    };

    /* ---------- Overall aggregator ---------- */
    function updateOverall(){
      const overall = {};
      for(const mode in playerStats){
        if(mode === 'overall') continue;
        for(const p in playerStats[mode]){
          if(!overall[p]) overall[p] = {wins:0,kills:0,deaths:0};
          const s = playerStats[mode][p];
          overall[p].wins += s.wins;
          overall[p].kills += s.kills;
          overall[p].deaths += s.deaths;
        }
      }
      playerStats.overall = overall;
    }

    /* ---------- Ranking algorithm ---------- */
    // score = wins*10 + kills + kd*5
    function getOrderedPlayers(mode){
      if(mode === 'overall') updateOverall();
      const entries = Object.entries(playerStats[mode] || {});
      const computed = entries.map(([name, stats]) => {
        const kd = (stats.deaths === 0) ? stats.kills : (stats.kills / stats.deaths);
        const score = (stats.wins * 10) + stats.kills + (kd * 5);
        return {name, stats, score};
      });
      computed.sort((a,b) => {
        if(b.score !== a.score) return b.score - a.score;
        if(b.stats.wins !== a.stats.wins) return b.stats.wins - a.stats.wins;
        if(b.stats.kills !== a.stats.kills) return b.stats.kills - a.stats.kills;
        return a.stats.deaths - b.stats.deaths;
      });
      return computed.map(c => c.name);
    }

    /* ---------- Rendering players list ---------- */
    function createPlayers(mode){
      if(mode === 'overall') updateOverall();
      const container = document.getElementById(mode);
      if(!container) return;
      const players = getOrderedPlayers(mode);
      container.innerHTML = '';
      players.forEach((name, i) => {
        let glow = '', numberClass = '';
        if(i===0){ glow='gold-glow'; numberClass='gold'; }
        else if(i===1){ glow='silver-glow'; numberClass='silver'; }
        else if(i===2){ glow='bronze-glow'; numberClass='bronze'; }

        const card = document.createElement('div');
        card.className = `player ${glow}`;
        card.style.animationDelay = `${i * 0.07}s`;
        card.onclick = () => openProfile(name, mode);

        // build inner content
        const numberSpan = `<span class="number ${numberClass}">#${i+1}</span>`;
        const playerContent = document.createElement('div');
        playerContent.className = 'player-content';
        playerContent.innerHTML = `<img src="${getAvatar(name)}" alt="${name} avatar" class="player-head"><b>${name}</b>`;

        card.innerHTML = numberSpan;
        card.appendChild(playerContent);
        container.appendChild(card);
      });

      if(players.length === 0){
        const div = document.createElement('div');
        div.className = 'no-players';
        div.textContent = 'No players found';
        container.appendChild(div);
      }
    }

    /* ---------- Profile view ---------- */
    function openProfile(name, mode){
      const stats = (playerStats[mode] || {})[name];
      const tierColors = {Gold:'#FFD700', Silver:'#C0C0C0', Bronze:'#CD7F32', Emerald:'#50C878', Diamond:'#00BFFF', 'Unranked':'#888'};

      if(!stats){
        const color = monoMode ? '#fff' : '#ff99cc';
        document.getElementById('profileContent').innerHTML = `<p style="color:${color}; font-weight:bold;">No stats for ${name} in ${mode}.</p>`;
      } else {
        const ranking = getOrderedPlayers(mode);
        const rank = ranking.indexOf(name) + 1;
        const kd = stats.deaths === 0 ? '∞' : (stats.kills / stats.deaths).toFixed(2);
        const tier = customTiers[mode]?.[name] || "Unranked";
        const tierColor = tierColors[tier] || '#888';
        let kdColor = 'white';
        if(kd === '∞' || Number(kd) >= 2) kdColor = 'limegreen';
        else if(Number(kd) >= 1) kdColor = 'yellow';
        else kdColor = 'red';

        document.getElementById('profileContent').innerHTML = `
          <h2 style="margin-top:0;display:flex;align-items:center;gap:12px;">
            <img src="${getAvatar(name,64)}" alt="${name} avatar" class="player-head" style="width:64px;height:64px;">
            <span>${name}</span>
          </h2>
          <h3 style="margin-top:-6px;color:${tierColor};">${tier}</h3>
          <div style="display:flex;justify-content:space-between;margin:15px 0 20px 0;padding:12px 16px;border-radius:10px;border:1px solid ${monoMode ? '#fff' : '#ff66cc'};font-weight:bold;">
            <div>K/D: <span style="color:${kdColor}">${kd}</span></div>
            <div>Rank: <span>#${rank}</span></div>
          </div>
          <p><b>Wins:</b> ${stats.wins}</p>
          <div class="stat-bar"><div class="stat-fill" id="winsBar" style="background:${tierColor}"></div></div>
          <p><b>Kills:</b> ${stats.kills}</p>
          <div class="stat-bar"><div class="stat-fill" id="killsBar" style="background:${tierColor}"></div></div>
          <p><b>Deaths:</b> ${stats.deaths}</p>
          <div class="stat-bar"><div class="stat-fill" id="deathsBar" style="background:${tierColor}"></div></div>
        `;
        // animate bars using stats for this player
        setTimeout(()=> animateBars(stats, tierColor), 20);
      }

      // hide main UI, show profile
      document.querySelector('.tabs').style.display = 'none';
      document.querySelector('.container').style.display = 'none';
      document.getElementById('searchInput').style.display = 'none';
      const profile = document.getElementById('profilePage');
      profile.style.display = 'block';
      setTimeout(()=> { profile.classList.add('show'); profile.setAttribute('aria-hidden','false'); }, 10);
    }

    /* ---------- Animate stat bars ---------- */
    function animateBars(stats, color){
      // stats: {wins,kills,deaths}
      const max = Math.max(stats.wins || 0, stats.kills || 0, stats.deaths || 0, 1);
      const mapping = [
        {id: 'winsBar', key: 'wins'},
        {id: 'killsBar', key: 'kills'},
        {id: 'deathsBar', key: 'deaths'}
      ];
      mapping.forEach((m, idx) => {
        const bar = document.getElementById(m.id);
        if(!bar) return;
        bar.style.width = '0%';
        bar.style.background = color;
        // force reflow to restart pseudo-element animation
        void bar.offsetWidth;
        setTimeout(() => {
          const value = stats[m.key] || 0;
          bar.style.width = Math.round((value / max) * 100) + '%';
        }, idx * 200);
      });
    }

    /* ---------- Go back from profile ---------- */
    function goBack(){
      const profile = document.getElementById('profilePage');
      profile.classList.remove('show');
      profile.setAttribute('aria-hidden','true');
      setTimeout(()=>{
        profile.style.display = 'none';
        document.querySelector('.tabs').style.display = 'flex';
        document.querySelector('.container').style.display = 'block';
        document.getElementById('searchInput').style.display = 'inline-block';
      }, 260);
    }

    /* ---------- Search ---------- */
    function searchPlayers(){
      const value = document.getElementById('searchInput').value.trim().toLowerCase();
      const active = document.querySelector('.mode.active');
      if(!active) return;
      // remove existing no-players placeholders in that mode so we can re-evaluate
      active.querySelectorAll('.no-players').forEach(np => np.remove());

      const players = Array.from(active.querySelectorAll('.player'));
      players.forEach(p => {
        const nameElem = p.querySelector('b');
        const name = nameElem ? nameElem.textContent.toLowerCase() : '';
        p.style.display = name.includes(value) ? 'flex' : 'none';
      });

      const visible = players.filter(p => p.style.display !== 'none');
      if(visible.length === 0){
        const div = document.createElement('div');
        div.className = 'no-players';
        div.textContent = 'No players found';
        active.appendChild(div);
      }
    }

    /* ---------- Mode switching ---------- */
    function showMode(mode, btn){
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
      const el = document.getElementById(mode);
      if(el) el.classList.add('active');

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if(btn) btn.classList.add('active');

      // render the mode list
      createPlayers(mode);
    }

    /* ---------- Boot ---------- */
    window.addEventListener('DOMContentLoaded', () => {
      // create all modes so they have content immediately
      ['sword','axe','uhc','mace','spear','overall'].forEach(mode => createPlayers(mode));

      // ensure overall tab & content active
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const overallTab = document.querySelector('.tabs button');
      if(overallTab) overallTab.classList.add('active');
      document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
      const overallDiv = document.getElementById('overall');
      if(overallDiv) overallDiv.classList.add('active');

      // ensure toggle thumb color matches initial state
      thumb.style.background = monoMode ? '#fff' : '#000';
    });
  </script>

</body>
</html>
